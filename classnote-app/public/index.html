<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17233c"><meta name="description" content="听课本：课堂录音、课程笔记、DeepSeek 学习助手、自测错题和复习计划。"><title>听课本 · 我的学习工作台</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><aside class="sidebar"><a class="brand" href="#dashboard"><span class="brand-icon">▥</span><span>听课本<small>CLASSNOTE / STUDY</small></span></a><div class="nav-label">学习空间</div><nav id="nav"><a href="#dashboard" data-page="dashboard">◫ <span>学习总览</span></a><a href="#courses" data-page="courses">▤ <span>我的课程</span></a><a href="#mistakes" data-page="mistakes">◎ <span>错题本</span></a><a href="#plan" data-page="plan">▦ <span>复习计划</span></a><a href="#progress" data-page="progress">▥ <span>学习记录</span></a></nav><div class="sidebar-bottom"><a href="#settings" data-page="settings">⚙ <span>AI 设置</span><i id="connection-dot"></i></a><div class="profile"><span class="avatar">学</span><div>我的学习空间<small>本机保存 · 独立应用</small></div></div></div></aside>
<div class="mobile-head"><a href="#dashboard">▥ 听课本</a><button id="mobile-nav" aria-label="打开导航">☰</button></div><div class="workspace"><header><span id="breadcrumb">学习总览</span><div class="header-right"><span id="today"></span><button class="primary small-button" data-action="new-course">＋ 新建课程</button></div></header><main id="main" tabindex="-1"><div class="loading">正在打开学习空间…</div></main><footer><span>听课本 / 每一堂课，都更进一步</span><span id="storage-status">数据保存在这台电脑</span></footer></div>
<dialog id="course-dialog"><form id="course-form"><div class="dialog-head"><div><p class="eyebrow">A NEW CHAPTER</p><h2>开始一门课程</h2></div><button type="button" class="icon-button" data-close="course-dialog" aria-label="关闭">×</button></div><label>课程名称<input name="title" placeholder="例如：高一物理 · 牛顿运动定律" maxlength="120" required></label><div class="form-row"><label>学科<select name="subject"><option>数学</option><option>语文</option><option>英语</option><option selected>物理</option><option>化学</option><option>生物</option><option>历史</option><option>地理</option><option>政治</option><option>计算机</option><option>其他</option></select></label><label>学习阶段<select name="level"><option>小学</option><option>初中</option><option selected>高中</option><option>大学</option><option>自主学习</option></select></label></div><label>想重点理解什么？<textarea name="focus" rows="3" maxlength="1000" placeholder="例如：公式的推导过程、典型题的解题方法"></textarea></label><div class="dialog-footer"><button type="button" class="secondary" data-close="course-dialog">取消</button><button class="primary">创建课程</button></div></form></dialog>
<dialog id="task-dialog"><form id="task-form"><div class="dialog-head"><h2>安排一次复习</h2><button type="button" class="icon-button" data-close="task-dialog" aria-label="关闭">×</button></div><label>复习内容<input name="title" maxlength="200" placeholder="例如：重做今天的物理错题" required></label><label>关联课程<select name="courseId" id="task-course"></select></label><div class="form-row"><label>日期<input name="date" type="date" required></label><label>预计时长（分钟）<input name="minutes" type="number" value="20" min="5" max="120" required></label></div><div class="dialog-footer"><button type="button" class="secondary" data-close="task-dialog">取消</button><button class="primary">加入计划</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div><input id="audio-file" type="file" accept=".mp3,.wav,.m4a,.ogg,.webm,.flac" hidden><input id="text-file" type="file" accept=".txt,.md,.srt,.vtt" hidden></body></html>
